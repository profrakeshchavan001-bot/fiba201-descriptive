<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FIBA201 Test Paper</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#16203a;--muted:#5d667d;--line:#dfe3ee;--accent:#b4232c;--accent-ink:#fff;--chip:#e9edf7;--font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-head:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1524;--card:#18203a;--ink:#e8ecf7;--muted:#a1abc6;--line:#2a3558;--accent:#ef6a72;--accent-ink:#1a0b0d;--chip:#222c4d;color-scheme:dark}}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;padding:20px 16px}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--font-head);margin:0;line-height:1.25}h1{font-size:1.45rem}h2{font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.sub{color:var(--muted);font-size:.92rem;margin:6px 0 0}
label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 5px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;width:100%;margin-top:16px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.err{color:var(--accent);font-size:.9rem;min-height:1.2em;margin-top:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.chip{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.qh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.qh span:last-child{font-size:.85rem;color:var(--muted);white-space:nowrap}
.qt{white-space:pre-wrap;overflow-wrap:anywhere}
.rules{margin:0;padding-left:1.2em;color:var(--muted);font-size:.92rem}.rules li+li{margin-top:4px}
</style></head><body><main id="app"></main>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function setNo(en){var d=String(en).replace(/\D/g,'');if(d.length){return (parseInt(d.slice(-6),10)%40)+1}var h=0;for(var i=0;i<en.length;i++){h=(h*31+en.charCodeAt(i))>>>0}return (h%40)+1}
function load(){var bin=Uint8Array.from(atob(B64),function(c){return c.charCodeAt(0)});return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(JSON.parse)}
function loginView(){
$('app').innerHTML='<div class="card"><h1>Fundamentals of Financial Management</h1><p class="sub">Descriptive test, 20 marks, 60 minutes. Topics: Time Value of Money, Ratio Analysis, Cash Flow Statement. Each student gets a different paper.</p><label for="nm">Full name</label><input id="nm" type="text" autocomplete="name" value="'+esc(ls('f201nm')||'')+'"><label for="en">Enrolment number</label><input id="en" type="text" autocapitalize="characters" value="'+esc(ls('f201en')||'')+'"><button id="go">Show my paper</button><div class="err" id="er"></div></div>';
$('go').onclick=function(){var nm=$('nm').value.trim(),en=$('en').value.trim().toUpperCase().replace(/\s+/g,'');
if(!nm||en.length<4){$('er').textContent='Enter your full name and your enrolment number.';return}
$('go').disabled=true;$('go').textContent='Loading...';
load().then(function(P){ls('f201nm',nm);ls('f201en',en);paperView(P,nm,en)}).catch(function(){$('er').textContent='Could not load the paper. Check your internet and try again.';$('go').disabled=false;$('go').textContent='Show my paper'})}}
var tick=null;
function paperView(P,nm,en){var n=setNo(en),p=P[n-1];var key='f201start_'+en,st=parseInt(ls(key)||'0',10);if(!st){st=Date.now();ls(key,String(st))}
var h='<div class="card"><div class="bar"><h1>Set '+n+'</h1><span class="chip" id="tm">'+DUR+':00</span></div><p class="sub">'+esc(nm)+' &middot; '+esc(en)+'</p></div><div class="card"><h2>Before you start</h2><ul class="rules"><li>Solve on A4 sheets and show full working.</li><li>Write your name, enrolment number and <b>Set '+n+'</b> on every page.</li><li>Submit your handwritten sheets to your teacher as instructed in class.</li><li>Do not share this screen or your set number.</li></ul></div>';
p.qs.forEach(function(q){h+='<div class="card"><div class="qh"><h2>Q'+q.no+'. '+esc(q.title)+'</h2><span>'+q.marks+' marks</span></div><div class="qt">'+esc(q.text)+'</div></div>'});
$('app').innerHTML=h;window.scrollTo(0,0);clearInterval(tick);
tick=setInterval(function(){var left=st+DUR*60000-Date.now();if(left<0)left=0;var m=Math.floor(left/60000),s=Math.floor(left%60000/1000);$('tm').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s},500)}
loginView();
</script></body></html>
